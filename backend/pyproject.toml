[project]
name = "pmab-remittance-intelligence"
version = "0.1.0"
description = "PMAB ERA/835 agentic remittance intelligence platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "polars>=1.17",
    "celery>=5.4",
    "redis>=5.2",
    "boto3>=1.35",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "pgvector>=0.3",
    "pyjwt>=2.10",
    "httpx>=0.27",
    "python-multipart>=0.0.17",
    "openpyxl>=3.1",
    "reportlab>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
